<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Binarization Threshold</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
    }

    .images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
    figcaption {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 8px;
    }
    .image-host {
      flex: 1;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    img, canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .controls {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .controls label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      white-space: nowrap;
    }
    .controls input[type=range] {
      flex: 1;
      accent-color: #2563eb;
    }
    .value {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #0f172a;
      min-width: 2.5em;
      text-align: right;
    }
    .stat {
      font-size: 0.85rem;
      color: #64748b;
      min-width: 14em;
      text-align: right;
    }
  </style>
</head>

    <figure>
      <figcaption>Binarized</figcaption>
      <div class="image-host">
        <canvas id="out"></canvas>
      </div>
    </figure>
  </div>

  <div class="controls">
    <label for="thresh">Threshold</label>
    <input id="thresh" type="range" min="0" max="255" value="128">
    <span class="value" id="val">128</span>
    <span class="stat" id="stat">— of pixels are above</span>
  </div>
</div>

<script>
  const img = document.getElementById('orig');
  const canvas = document.getElementById('out');
  const thresh = document.getElementById('thresh');
  const val = document.getElementById('val');
  const stat = document.getElementById('stat');

  function redraw() {
    if (!img.complete || !img.naturalWidth) return;

    // Match the drawing surface to the source image so pixels line up 1:1.
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    // Read every pixel, decide on/off by average brightness, write back.
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const t = parseInt(thresh.value, 10);
    let above = 0;
    for (let i = 0; i < data.data.length; i += 4) {
      const brightness = (data.data[i] + data.data[i + 1] + data.data[i + 2]) / 3;
      const on = brightness > t;
      data.data[i]     = on ? 255 : 0;
      data.data[i + 1] = on ? 255 : 0;
      data.data[i + 2] = on ? 255 : 0;
      if (on) above++;
    }
    ctx.putImageData(data, 0, 0);

    val.textContent = t;
    const pct = ((above / (data.data.length / 4)) * 100).toFixed(1);
    stat.textContent = pct + '% of pixels are above';
  }

  img.addEventListener('load', redraw);
  if (img.complete) redraw();
  thresh.addEventListener('input', redraw);
</script>
