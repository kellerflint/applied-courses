<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>let vs useRef Counter</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 16px;
      min-height: 100vh;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h2 {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 10px;
      font-family: 'Menlo', 'Monaco', monospace;
    }

    .panel {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel.left { border-top: 4px solid #ef4444; }
    .panel.right { border-top: 4px solid #10b981; }

    .display {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 14px 16px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 1.05rem;
      color: #0f172a;
      text-align: center;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #475569;
      font-family: 'Menlo', 'Monaco', monospace;
    }
    .stat-row .label { color: #64748b; }
    .stat-row .value {
      color: #0f172a;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: white;
      color: #334155;
    }
    button:hover { filter: brightness(0.95); }

    .log {
      background: #0f172a;
      color: #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 0.78rem;
      height: 130px;
      overflow-y: auto;
      line-height: 1.55;
    }
    .log .entry { padding: 1px 0; }
    .log .entry.reset { color: #fbbf24; }
    .log .empty { color: #475569; font-style: italic; }

    .caption {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.45;
      padding-top: 6px;
      border-top: 1px dashed #e2e8f0;
    }
    .caption strong { color: #0f172a; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useRef } = React;

  function Log({ entries }) {
    if (entries.length === 0) {
      return <div className="log"><span className="empty">(click +1 to see what's happening)</span></div>;
    }
    return (
      <div className="log">
        {entries.map((e, i) => (
          <div key={i} className={'entry' + (e.kind ? ' ' + e.kind : '')}>{e.text}</div>
        ))}
      </div>
    );
  }

  // Track how many times THIS component instance has rendered. Using a ref
  // so reading it doesn't itself trigger a render.
  function useRenderCount() {
    const count = useRef(0);
    count.current += 1;
    return count.current;
  }

  // ---------------------------------------------------------------
  // LEFT: count stored in a `let`. Every click bumps count, then
  // setLog triggers a re-render, which re-runs the function and
  // resets `let count = 0`. So count is always 1 in the log.
  // ---------------------------------------------------------------
  function LetCounter() {
    let count = 0;
    const [log, setLog] = useState([]);
    const renders = useRenderCount();

    function bump() {
      count++;
      // setLog will trigger a re-render. By the time the next render runs,
      // `let count = 0` will reset count back to 0.
      setLog((l) => [...l.slice(-7), { text: `clicked +1, count is now ${count}` }]);
    }

    function forceRerender() {
      setLog((l) => [...l.slice(-7), { text: '--- forced a re-render ---', kind: 'reset' }]);
    }

    return (
      <div className="panel left">
        <h2>let count = 0</h2>
        <div className="display">count = {count}</div>
        <div className="stat-row">
          <span className="label">render count</span>
          <span className="value">{renders}</span>
        </div>
        <div className="controls">
          <button onClick={bump}>+1</button>
          <button className="secondary" onClick={forceRerender}>force re-render</button>
        </div>
        <Log entries={log} />
        <div className="caption">
          Each click re-renders the component. <code>let count = 0</code> runs
          again every render, so the count <strong>resets between every click</strong>.
          The log always shows <code>1</code>.
        </div>
      </div>
    );
  }

  // ---------------------------------------------------------------
  // RIGHT: count stored in a useRef. React hands back the SAME ref
  // container every render, so .current survives the re-render.
  // ---------------------------------------------------------------
  function RefCounter() {
    const count = useRef(0);
    const [log, setLog] = useState([]);
    const renders = useRenderCount();

    function bump() {
      count.current++;
      setLog((l) => [...l.slice(-7), { text: `clicked +1, count.current is now ${count.current}` }]);
    }

    function forceRerender() {
      setLog((l) => [...l.slice(-7), { text: '--- forced a re-render ---', kind: 'reset' }]);
    }

    return (
      <div className="panel right">
        <h2>const count = useRef(0)</h2>
        <div className="display">count.current = {count.current}</div>
        <div className="stat-row">
          <span className="label">render count</span>
          <span className="value">{renders}</span>
        </div>
        <div className="controls">
          <button onClick={bump}>+1</button>
          <button className="secondary" onClick={forceRerender}>force re-render</button>
        </div>
        <Log entries={log} />
        <div className="caption">
          Each click also re-renders. But <code>useRef(0)</code> only uses
          the <code>0</code> on the very first render; after that it hands
          back the same container. <code>.current</code> <strong>survives</strong>:
          1, 2, 3, 4...
        </div>
      </div>
    );
  }

  function App() {
    return (
      <div className="layout">
        <LetCounter />
        <RefCounter />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
