<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Field Notebook</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f8f9fa;
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 0.5rem 0.8rem;
    background: #fff;
    border-bottom: 1px solid #e1e4e8;
    font-size: 0.8rem;
    color: #555;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .header strong { color: #1a1a1a; }
  .header .spacer { margin-left: auto; }

  .btn {
    border: 1px solid #d0d7de;
    background: #fff;
    color: #1a1a1a;
    padding: 0.3rem 0.7rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.subtle { color: #b91c1c; border-color: #f0c4c4; }
  .btn.subtle:hover { background: #fef2f2; }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 0.6rem;
    padding: 0.6rem;
    min-height: 0;
  }

  .quad {
    background: #fff;
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    border-top: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .quad-head {
    padding: 0.4rem 0.6rem 0.3rem;
    flex-shrink: 0;
  }
  .quad-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .quad-hint {
    font-size: 0.68rem;
    color: #9ca3af;
    margin-top: 0.1rem;
  }

  .notes {
    flex: 1;
    overflow-y: auto;
    padding: 0 0.5rem;
    min-height: 0;
  }
  .note {
    display: flex;
    align-items: flex-start;
    gap: 0.4rem;
    font-size: 0.78rem;
    line-height: 1.3;
    padding: 0.3rem 0.4rem;
    border-radius: 5px;
    background: #f8f9fa;
    margin-bottom: 0.3rem;
  }
  .note span { flex: 1; word-break: break-word; }
  .note button {
    border: none;
    background: transparent;
    color: #b0b6bd;
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
  }
  .note button:hover { color: #b91c1c; }
  .empty {
    font-size: 0.72rem;
    color: #b0b6bd;
    font-style: italic;
    padding: 0.3rem 0.4rem;
  }

  .add-row {
    display: flex;
    gap: 0.35rem;
    padding: 0.4rem 0.5rem;
    flex-shrink: 0;
  }
  .add-row input {
    flex: 1;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 0.35rem 0.5rem;
    font-size: 0.76rem;
    font-family: inherit;
    min-width: 0;
  }
  .add-row input:focus { outline: none; border-color: var(--accent); }
  .add-row button {
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    width: 30px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  .add-row button:hover { filter: brightness(0.94); }

  .q-wins    { --accent: #16a34a; }
  .q-stumble { --accent: #dc2626; }
  .q-tactics { --accent: #2563eb; }
  .q-ideas   { --accent: #7c3aed; }
</style>
</head>
<body>
  <div class="header">
    <strong>Agent Field Notebook</strong>
    <span>Log what you notice as you build. It saves in this browser.</span>
    <span class="spacer"></span>
    <button class="btn primary" id="copyBtn">Copy field notes</button>
    <button class="btn subtle" id="clearBtn">Clear all</button>
  </div>

  <div class="grid">
    <div class="quad q-wins" data-key="wins">
      <div class="quad-head">
        <div class="quad-title">Wins</div>
        <div class="quad-hint">What did it handle well or fast?</div>
      </div>
      <div class="notes"></div>
      <div class="add-row">
        <input type="text" placeholder="Add a win..." aria-label="Add a win">
        <button aria-label="Add">+</button>
      </div>
    </div>

    <div class="quad q-stumble" data-key="stumbles">
      <div class="quad-head">
        <div class="quad-title">Stumbles</div>
        <div class="quad-hint">Where did it break or get stuck?</div>
      </div>
      <div class="notes"></div>
      <div class="add-row">
        <input type="text" placeholder="Add a stumble..." aria-label="Add a stumble">
        <button aria-label="Add">+</button>
      </div>
    </div>

    <div class="quad q-tactics" data-key="tactics">
      <div class="quad-head">
        <div class="quad-title">Tactics that worked</div>
        <div class="quad-hint">What did you say that got good results?</div>
      </div>
      <div class="notes"></div>
      <div class="add-row">
        <input type="text" placeholder="Add a tactic..." aria-label="Add a tactic">
        <button aria-label="Add">+</button>
      </div>
    </div>

    <div class="quad q-ideas" data-key="ideas">
      <div class="quad-head">
        <div class="quad-title">Ideas to try next time</div>
        <div class="quad-hint">What would have made the agent more effective?</div>
      </div>
      <div class="notes"></div>
      <div class="add-row">
        <input type="text" placeholder="Add an idea..." aria-label="Add an idea">
        <button aria-label="Add">+</button>
      </div>
    </div>
  </div>

<script>
  const STORAGE_KEY = "vibe-coding-field-notes";
  const LABELS = {
    wins: "Wins",
    stumbles: "Stumbles",
    tactics: "Tactics that worked",
    ideas: "Ideas to try next time"
  };

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { wins: [], stumbles: [], tactics: [], ideas: [] };
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  let state = load();

  function renderQuad(quad) {
    const key = quad.dataset.key;
    const notesEl = quad.querySelector(".notes");
    const items = state[key] || [];
    notesEl.innerHTML = "";
    if (items.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nothing logged yet.";
      notesEl.appendChild(empty);
      return;
    }
    items.forEach((text, i) => {
      const note = document.createElement("div");
      note.className = "note";
      const span = document.createElement("span");
      span.textContent = text;
      const del = document.createElement("button");
      del.textContent = "×";
      del.setAttribute("aria-label", "Delete note");
      del.addEventListener("click", () => {
        state[key].splice(i, 1);
        save();
        renderQuad(quad);
      });
      note.appendChild(span);
      note.appendChild(del);
      notesEl.appendChild(note);
    });
  }

  function renderAll() {
    document.querySelectorAll(".quad").forEach(renderQuad);
  }

  document.querySelectorAll(".quad").forEach((quad) => {
    const key = quad.dataset.key;
    const input = quad.querySelector("input");
    const addBtn = quad.querySelector(".add-row button");
    const notesEl = quad.querySelector(".notes");

    function add() {
      const text = input.value.trim();
      if (!text) return;
      if (!state[key]) state[key] = [];
      state[key].push(text);
      input.value = "";
      save();
      renderQuad(quad);
      notesEl.scrollTop = notesEl.scrollHeight;
    }

    addBtn.addEventListener("click", add);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") add();
    });
  });

  document.getElementById("copyBtn").addEventListener("click", (e) => {
    const lines = ["# Agent Field Notes", ""];
    Object.keys(LABELS).forEach((key) => {
      lines.push("## " + LABELS[key]);
      const items = state[key] || [];
      if (items.length === 0) {
        lines.push("- (none yet)");
      } else {
        items.forEach((t) => lines.push("- " + t));
      }
      lines.push("");
    });
    const md = lines.join("\n");
    const btn = e.currentTarget;
    const original = btn.textContent;
    const done = () => { btn.textContent = "Copied!"; setTimeout(() => { btn.textContent = original; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(md).then(done).catch(() => fallbackCopy(md, done));
    } else {
      fallbackCopy(md, done);
    }
  });

  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.getElementById("clearBtn").addEventListener("click", () => {
    if (!confirm("Clear all field notes? This can't be undone.")) return;
    state = { wins: [], stumbles: [], tactics: [], ideas: [] };
    save();
    renderAll();
  });

  renderAll();
</script>
</body>
</html>
